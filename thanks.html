<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | Robusq</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.png" type="image/png" sizes="256x256">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Work+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0B0B0B; color: #FAFAF8;
    font-family: 'Work Sans', system-ui, sans-serif; font-weight: 300;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  header { padding: 26px clamp(20px, 5vw, 72px); }
  header img { display: block; height: 26px; width: auto; }
  main {
    flex: 1; display: flex; align-items: center;
    padding: clamp(48px, 10vw, 120px) clamp(20px, 5vw, 72px);
  }
  .box { max-width: 560px; }
  .eyebrow {
    margin: 0 0 20px; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 500;
    letter-spacing: .3em; text-transform: uppercase; color: #8C8880;
  }
  h1 {
    margin: 0; font-family: 'Archivo', sans-serif; font-weight: 600;
    font-size: clamp(30px, 5vw, 50px); line-height: 1.12; letter-spacing: -0.01em;
  }
  p.body { margin: 24px 0 0; font-size: 17px; line-height: 1.75; color: #C6C2BB; }
  .btn {
    display: inline-block; margin-top: 38px;
    font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 500;
    letter-spacing: .18em; text-transform: uppercase;
    padding: 16px 32px; border: 1px solid #FAFAF8; color: #FAFAF8;
    transition: background .2s, color .2s;
  }
  .btn:hover, .btn:focus-visible { background: #FAFAF8; color: #0B0B0B; }
  footer { border-top: 1px solid #242320; color: #8C8880; padding: 30px clamp(20px, 5vw, 72px); }
  footer p { margin: 0; font-size: 13px; letter-spacing: .04em; }
  :focus-visible { outline: 2px solid #D6D2CA; outline-offset: 3px; }
</style>
</head>
<body>

<header>
  <a href="/" aria-label="Robusq home"><img src="logo.png" alt="Robusq"></a>
</header>

<main>
  <div class="box">
    <p class="eyebrow">Enquiry received</p>
    <h1>Thank you. Your message is through.</h1>
    <p class="body">We read everything that comes in and we will come back to you shortly.</p>
    <a class="btn" href="/">Back to the site</a>
  </div>
</main>

<footer>
  <p>Brisbane, Queensland &middot; &copy; 2026 Robusq</p>
</footer>

</body>
</html>
